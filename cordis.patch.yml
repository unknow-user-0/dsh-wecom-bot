# WeCom Bot —— DSH bundle patch
#
# 1) wecom-bot：插件本体（宿主半边 src/host.js + 网页半边 client/client.js）
# 2) 三个 agent preset，只给 WeCom Bot 自己建的会话用：
#    - wecom-owner      ：管理员私聊，完整工具 + 人格 + 浏览器 + 视频 + 文件
#    - wecom-owner-long ：同上，另挂 jobs + schedule（面板「长任务模式」打开时用，默认关）
#    - wecom-social     ：群聊 / 白名单成员私聊，只有企微社交工具，没有任何电脑操作能力
#
# 人格通过提示词变量 {{wecom_persona}} 放在系统提示词最前面（由插件注册，面板切换人格即时生效）。
#
# 开源默认值（按最终决策）：
#   - 管理员私聊：浏览器 / 视频 / 文件文档 默认开放；MCP 写 / 真人身份发消息 默认关闭
#   - 群聊 / 白名单：只有社交工具，零本地能力
- insert:
    - id: wecom-bot
      name: dsh-wecom-bot
    - id: preset-wecom-owner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wecom-owner
        name: 企业微信 · 管理员
        description: 管理员私聊：人格 + 完整工具（含浏览器、视频、文件）
        order: 70
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{wecom_persona}}\n\n{{wecom_rules_owner}}"
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南。
              # 工具照样挂着，模型靠工具定义本身就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-wecom-owner-long
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wecom-owner-long
        name: 企业微信 · 管理员（长任务模式）
        description: 管理员私聊 + 后台任务（jobs）和定时任务（schedule）：长任务跑完会自动回报
        order: 72
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{wecom_persona}}\n\n{{wecom_rules_owner}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
    - id: preset-wecom-social
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wecom-social
        name: 企业微信 · 群聊
        description: 群里和白名单成员私聊时用：人格 + 只有企微社交工具，没有任何电脑操作能力
        order: 71
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{wecom_persona}}\n\n{{wecom_rules_social}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
